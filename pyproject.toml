[build-system]
requires= ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttape-ai"
version = "0.1.0"
description = "Deterministic sandboxing, semantic mocking, and air-gapped testing infrastructure for Agentic AI workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Muthuraj", email = "muthurajp00l@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
keywords = ["ai-agents", "langgraph", "testing", "mocking", "ci-cd", "determinism"]
dependencies = [
    "httpx>=0.27.0",
]


[tool.setuptools]
package-dir = {"agenttape" = "src/core"}
packages = ["agenttape"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "langgraph>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/Muthu324/agenttape"
Issues = "https://github.com/Muthu324/agenttape/issues"


[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
