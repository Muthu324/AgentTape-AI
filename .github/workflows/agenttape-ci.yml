name: AgentTape Air-Gapped CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-airgapped:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest langgraph

      - name: Enforce Air-Gapped Network Policy
        run: |
          echo "127.0.0.1 ://openai.com" | sudo tee -a /etc/hosts
          echo "127.0.0.1 ://anthropic.com" | sudo tee -a /etc/hosts

      - name: Run Deterministic Offline Test Suite
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v
